# Full app on your own machine: docker compose up --build, then open http://localhost:3000
services:
  api:
    build:
      context: .
      target: api
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      HARNESS_CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
