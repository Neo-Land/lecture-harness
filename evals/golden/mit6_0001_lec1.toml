reviewed = false  # Claude's draft. Neo sets true after checking each point against the slides.

[[point]]
text = "Declarative knowledge is statements of fact; imperative knowledge is a recipe or how-to."
slides = [10]
keywords = ["declarative", "imperative"]

[[point]]
text = "An algorithm is a sequence of simple steps, flow of control, and a way to determine when to stop."
slides = [12]
keywords = ["algorithm", "stop"]

[[point]]
text = "A stored program computer keeps a sequence of instructions, run in order by an interpreter."
slides = [13, 15]
keywords = ["stored program"]

[[point]]
text = "Turing showed you can compute anything using 6 primitives."
slides = [16]
keywords = ["turing", "6"]

[[point]]
text = "Languages have syntax, static semantics, and semantics, and errors occur at each level."
slides = [19, 20, 21, 22]
keywords = ["syntax", "semantic"]

[[point]]
text = "Objects have types; scalar types are int, float, bool, and NoneType."
slides = [24, 25]
keywords = ["int", "float", "bool"]

[[point]]
text = "An assignment binds a name to a value, and names can be re-bound later."
slides = [31, 34]
keywords = ["bind"]
